# serverq.md § 4 Release: one static Linux binary per arch, a Windows binary (§ 7), SHA256SUMS, latest.json. A failing selftest publishes nothing.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
            name: linux-aarch64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SERVERQ_SELFTEST_OFFLINE: '1'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup update stable --no-self-update && rustup default stable && rustup target add "$TARGET"
      - name: Version from tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          perl -pi -e 'if (!$d && s/^version = ".*"/version = "'"$ver"'"/) { $d = 1 }' Cargo.toml
          grep -q "^version = \"$ver\"" Cargo.toml
          echo "VER=$ver" >> "$GITHUB_ENV"
      - run: cargo test
      - run: cargo build --release --target "$TARGET"
      - name: Selftest and stage
        run: |
          bin="target/$TARGET/release/serverq${{ matrix.ext }}"
          [ "$RUNNER_OS" != Linux ] || file "$bin" | grep -Eq 'static(ally|-pie) linked'
          "$bin" selftest
          mkdir dist
          cp "$bin" "dist/serverq-$VER-${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Describe
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum serverq-* > SHA256SUMS
          python3 - "$ver" <<'PY'
          import json, os, sys
          ver = sys.argv[1]
          files = {n[len(f'serverq-{ver}-'):].removesuffix('.exe'): n for n in sorted(os.listdir('.')) if n.startswith(f'serverq-{ver}-')}
          assert set(files) == {'linux-x86_64', 'linux-aarch64', 'windows-x86_64'}, files
          json.dump({'version': ver, 'files': files}, open('latest.json', 'w'), indent=1)
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ServerQ $GITHUB_REF_NAME" --notes "serverq $GITHUB_REF_NAME"
