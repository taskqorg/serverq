name: Check
on: [push, pull_request, merge_group]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: taskqorg/specq, ref: 7e9adf57287553176d8b3be61c2b22565543dc51, path: .specq}
      - run: python3 .specq/engineering/scripts/contract_lint.py serverq.md
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    # macOS runs on the self-hosted Apple-silicon runner; fork pull requests stay GitHub-hosted.
    runs-on: ${{ matrix.os == 'macos-15' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "taskq-mac"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: rustup update stable --no-self-update && cargo test --locked
