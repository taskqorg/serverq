name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile serverq.py tools/package_release.py
      - run: python tools/package_release.py --output /tmp/serverq-dist && test -f /tmp/serverq-dist/serverq-0.2.0.zip && test -f /tmp/serverq-dist/serverq-0.2.0.manifest.json
