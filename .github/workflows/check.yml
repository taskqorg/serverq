name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile serverq.py tools/package_release.py
      - run: |
          python tools/package_release.py --output /tmp/serverq-dist
          python -c 'import json,pathlib; v=json.load(open("release.json"))["version"]; p=pathlib.Path("/tmp/serverq-dist"); assert (p/f"serverq-{v}.zip").is_file() and (p/f"serverq-{v}.manifest.json").is_file()'
